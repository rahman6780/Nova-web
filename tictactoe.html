<!doctype html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tic Tac Toe</title>
<meta name="theme-color" content="#070b16">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#070b16;--panel:#0d1426;--line:#1b2a52;--ink:#dfe9ff;--mut:#7389b8;--blue:#19b4ff;--red:#ff2e63;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{height:100%}
body{margin:0;min-height:100%;color:var(--ink);font-family:'Share Tech Mono',ui-monospace,Menlo,Consolas,monospace;display:flex;flex-direction:column;align-items:center;padding:16px 8px 28px;gap:16px;
background:radial-gradient(circle at 15% 0,rgba(25,180,255,.16),transparent 45%),radial-gradient(circle at 85% 100%,rgba(255,46,99,.16),transparent 45%),repeating-linear-gradient(0deg,rgba(120,150,220,.05) 0 1px,transparent 1px 32px),repeating-linear-gradient(90deg,rgba(120,150,220,.05) 0 1px,transparent 1px 32px),var(--bg)}
h1{margin:0;font:800 1.9rem/1.1 Orbitron,system-ui,sans-serif;letter-spacing:.04em;text-shadow:-2px 0 var(--red),2px 0 var(--blue),0 0 14px rgba(255,255,255,.25)}
#st{min-height:1.5em;font-size:1.1rem;color:var(--ink);text-align:center}
#st::before{content:"> ";color:var(--blue)}
#bd{width:min(92vw,360px);box-sizing:border-box;padding:10px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:10px;transition:border-color .2s,box-shadow .2s}
#bd[data-t="X"]{border-color:var(--blue);box-shadow:0 0 26px rgba(25,180,255,.35)}
#bd[data-t="O"]{border-color:var(--red);box-shadow:0 0 26px rgba(255,46,99,.35)}
#bd button{aspect-ratio:1;border:1px solid var(--line);border-radius:6px;background:#0a1020;box-shadow:inset 0 0 14px rgba(25,180,255,.07);font:800 min(18vw,70px)/1 Orbitron,system-ui,sans-serif;color:var(--ink);cursor:pointer;-webkit-tap-highlight-color:transparent;text-shadow:0 0 14px currentColor}
#bd button.X{color:var(--blue);border-color:rgba(25,180,255,.55)}
#bd button.O{color:var(--red);border-color:rgba(255,46,99,.55)}
#bd button.win{animation:pulse 1s ease-in-out infinite alternate}
#bd button.win.X{border-color:var(--blue);box-shadow:0 0 22px var(--blue),inset 0 0 18px rgba(25,180,255,.35)}
#bd button.win.O{border-color:var(--red);box-shadow:0 0 22px var(--red),inset 0 0 18px rgba(255,46,99,.35)}
@keyframes pulse{to{transform:scale(.94)}}
@media (prefers-reduced-motion:reduce){#bd button.win{animation:none}}
.row{display:grid;gap:8px;width:min(92vw,360px)}
.r3{grid-template-columns:repeat(3,1fr)}
.r2{grid-template-columns:1fr 1fr}
.sc div{background:var(--panel);border:1px solid var(--line);border-top-width:3px;border-radius:6px;padding:8px 4px;text-align:center;font-size:.85rem;color:var(--mut)}
.sc div:nth-child(1){border-top-color:var(--blue)}
.sc div:nth-child(3){border-top-color:var(--red)}
.sc b{display:block;font:800 1.4rem Orbitron,system-ui,sans-serif;color:var(--ink);font-variant-numeric:tabular-nums}
label{display:flex;flex-direction:column;gap:3px;font-size:.8rem;color:var(--mut)}
select{font:inherit;font-size:1rem;padding:9px 6px;border-radius:6px;border:1px solid var(--blue);background:var(--panel);color:var(--ink)}
#nw{font:600 1rem Orbitron,system-ui,sans-serif;padding:13px;border-radius:6px;border:1px solid var(--red);background:linear-gradient(90deg,rgba(25,180,255,.25),rgba(255,46,99,.25));color:var(--ink);cursor:pointer;width:min(92vw,360px);box-shadow:0 0 16px rgba(255,46,99,.25)}
button:focus-visible,select:focus-visible{outline:3px solid #f2c14e;outline-offset:2px}
</style></head><body>
<h1>Tic Tac Toe</h1>
<div id="st"></div>
<div id="bd"></div>
<div class="row r3 sc"><div>Menang<b id="sw">0</b></div><div>Seri<b id="sd">0</b></div><div>Kalah<b id="sl">0</b></div></div>
<div class="row r2">
<label>Kamu main<select id="side"><option value="X">X (jalan duluan)</option><option value="O">O (AI duluan)</option></select></label>
<label>Level AI<select id="lv"><option value="1">Santai</option><option value="2" selected>Jago</option></select></label>
</div>
<button id="nw">Game baru</button>
<script>
// ===== 1. DATA =====
// Papan = array 9 isi: '' (kosong), 'X', atau 'O'. Urutan kotak:
//  0 1 2
//  3 4 5
//  6 7 8
let b, me, turn, over, line, sc = {w: 0, d: 0, l: 0};
const $ = id => document.getElementById(id);

// 8 garis kemenangan: 3 baris, 3 kolom, 2 diagonal
const L = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];

// ===== 2. CEK MENANG =====
// Kalau ada garis yang 3 kotaknya isi sama dan gak kosong, kembalikan garis itu.
function win(b) {
  for (const l of L) {
    const [a, c, d] = l;
    if (b[a] && b[a] === b[c] && b[a] === b[d]) return l;
  }
  return null;
}

// ===== 3. OTAK AI: MINIMAX =====
// Ide: AI "ngebayangin" semua kemungkinan lanjutan game sampai habis.
// Skor dihitung dari sudut pandang AI: menang = positif, kalah = negatif, seri = 0.
// Giliran AI -> pilih skor TERBESAR. Giliran lawan -> dia pasti pilih skor TERKECIL.
// d = kedalaman, biar AI milih menang yang paling cepat dan kalah yang paling lambat.
function mm(b, t, ai, d) {
  const w = win(b);
  if (w) return b[w[0]] === ai ? 10 - d : d - 10;
  if (b.every(Boolean)) return 0;                  // papan penuh tanpa pemenang = seri
  const next = t === 'X' ? 'O' : 'X';
  let best = t === ai ? -99 : 99;
  for (let i = 0; i < 9; i++) {
    if (b[i]) continue;
    b[i] = t;                                      // coba jalan di kotak i
    const v = mm(b, next, ai, d + 1);              // lanjut ngebayangin giliran lawan
    b[i] = '';                                     // batalin (backtrack)
    best = t === ai ? Math.max(best, v) : Math.min(best, v);
  }
  return best;
}

function aiMove() {
  const ai = me === 'X' ? 'O' : 'X', empty = [];
  for (let i = 0; i < 9; i++) if (!b[i]) empty.push(i);
  // level Santai: 40% kemungkinan AI jalan ngasal
  if ($('lv').value === '1' && Math.random() < 0.4) return empty[Math.floor(Math.random() * empty.length)];
  let bestV = -99, bestM = [];
  for (const i of empty) {
    b[i] = ai;
    const v = mm(b, me, ai, 1);
    b[i] = '';
    if (v > bestV) { bestV = v; bestM = [i]; }
    else if (v === bestV) bestM.push(i);           // simpan semua langkah yang sama bagusnya
  }
  return bestM[Math.floor(Math.random() * bestM.length)]; // pilih acak biar gak monoton
}

// ===== 4. ALUR GAME =====
function init() {
  b = Array(9).fill('');
  me = $('side').value;
  turn = 'X';
  over = false;
  line = null;
  render();
  if (me !== 'X') setTimeout(aiTurn, 350);
}

function place(i) {
  b[i] = turn;
  line = win(b);
  if (line || b.every(Boolean)) {
    over = true;
    if (!line) sc.d++;
    else if (turn === me) sc.w++;
    else sc.l++;
  } else {
    turn = turn === 'X' ? 'O' : 'X';
  }
  render();
}

function aiTurn() {
  if (!over && turn !== me) place(aiMove());
}

$('bd').onclick = e => {
  const el = e.target.closest('button');
  if (!el || over || turn !== me) return;
  const i = +el.dataset.i;
  if (b[i]) return;
  place(i);
  if (!over) setTimeout(aiTurn, 350);
};

// ===== 5. TAMPILAN =====
function render() {
  $('bd').innerHTML = b.map((v, i) =>
    `<button data-i="${i}" class="${v}${line && line.includes(i) ? ' win' : ''}" aria-label="Kotak ${i + 1}${v ? ', ' + v : ''}">${v}</button>`
  ).join('');
  $('bd').dataset.t = over ? '' : turn;            // warna bingkai ikut giliran: biru = X, merah = O
  $('sw').textContent = sc.w;
  $('sd').textContent = sc.d;
  $('sl').textContent = sc.l;
  $('st').textContent = over
    ? (line ? (b[line[0]] === me ? 'Kamu menang!' : 'AI menang. Coba lagi?') : 'Seri')
    : (turn === me ? `Giliran kamu (${me})` : 'AI lagi mikir…');
}

$('nw').onclick = init;
$('side').onchange = init;
$('lv').onchange = init;
init();
</script></body></html>
